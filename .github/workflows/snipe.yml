name: halisaha

on:
  # Elle yapılan dry-run testi geçene kadar KAPALI. Açınca: Pzt-Çar (UTC) her 30 dk bir tur.
  # TR = UTC+3. Açılış saati öğrenilince tek bir "keskin" satıra indirilecek.
  # schedule:
  #   - cron: "*/30 * * * 1,2,3"
  workflow_dispatch:
    inputs:
      sure:
        description: "Kaç dakika denesin (0 = tek tur)"
        default: "0"
      dry_run:
        description: "Deneme modu (tıklamaz)"
        type: boolean
        default: true

concurrency:
  group: halisaha
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Bot
        env:
          SPOR_TC: ${{ secrets.SPOR_TC }}
          SPOR_SIFRE: ${{ secrets.SPOR_SIFRE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: >
          python -m bot.main
          --sure "${{ github.event.inputs.sure || '0' }}"
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
