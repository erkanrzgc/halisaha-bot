name: gozlem

# Her 6 saatte bir başlar, ~5 saat 40 dk gözler, gozlem.csv'yi repoya geri yazar.
# Cron gecikebilir; aradaki kısa boşluklarda olan değişiklik bir sonraki turun başında kaydedilir.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      sure:
        description: "Kaç dakika gözlesin"
        default: "340"

permissions:
  contents: write

concurrency:
  group: gozlem
  cancel-in-progress: false

jobs:
  gozle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Gözle
        env:
          SPOR_TC: ${{ secrets.SPOR_TC }}
          SPOR_SIFRE: ${{ secrets.SPOR_SIFRE }}
        run: python -m bot.gozlem --sure "${{ github.event.inputs.sure || '340' }}"
      - name: Kaydı repoya yaz
        if: always()
        run: |
          [ -f gozlem.csv ] || exit 0
          git config user.name "gozlem-bot"
          git config user.email "gozlem-bot@users.noreply.github.com"
          git add -f gozlem.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore: gözlem kaydı [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
